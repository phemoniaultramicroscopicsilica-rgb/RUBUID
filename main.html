<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUBUID Generator Pro</title>
<style>
    :root {
        --primary-color: #4A90E2;
        --background-color: #f5f5f7;
        --text-color: #333;
        --card-color: #fff;
        --button-hover: #357ABD;
    }

    [data-theme="dark"] {
        --background-color: #1e1e1e;
        --text-color: #f5f5f5;
        --card-color: #2a2a2a;
        --button-hover: #2860A0;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--background-color);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: var(--text-color);
        transition: background 0.3s, color 0.3s;
    }

    .container {
        background: var(--card-color);
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        text-align: center;
        max-width: 450px;
        width: 90%;
        transition: background 0.3s, color 0.3s;
    }

    h1 {
        margin-bottom: 10px;
        color: var(--primary-color);
    }

    p {
        font-size: 14px;
        color: #666;
        margin-bottom: 20px;
    }

    button {
        background: var(--primary-color);
        color: white;
        border: none;
        padding: 12px 20px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        margin: 5px;
        transition: background 0.3s;
    }

    button:hover {
        background: var(--button-hover);
    }

    input, select {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        margin-top: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
        text-align: center;
    }

    small {
        display: block;
        margin-top: 10px;
        color: #999;
    }

    .history {
        text-align: left;
        margin-top: 20px;
        max-height: 150px;
        overflow-y: auto;
        border-top: 1px solid #ccc;
        padding-top: 10px;
        font-size: 14px;
        color: var(--text-color);
    }

    .history div {
        margin-bottom: 5px;
        word-break: break-all;
    }

    .theme-toggle {
        margin-top: 15px;
        font-size: 14px;
        background: #888;
    }
</style>
</head>
<body data-theme="light">

<div class="container">
    <h1>RUBUID Generator Pro</h1>
    <p>Generate a Random, Unique, and Universal Identifier</p>

    <input type="text" id="prefix" placeholder="Custom prefix (default: RUB)" maxlength="10">

    <button onclick="generateRUBUID()">Generate RUBUID</button>
    <button onclick="generateRUBUIDv2()">Generate RUBUIDv2</button>
    <button onclick="copyToClipboard()">Copy to Clipboard</button>
    <button class="theme-toggle" onclick="toggleTheme()">Toggle Light/Dark</button>

    <input type="text" id="uuidOutput" readonly placeholder="Your RUBUID will appear here">
    <small>Click a button to generate your custom UUID</small>

    <div class="history" id="history"></div>
</div>

<script>
    let historyList = [];

    function getPrefix() {
        const prefixInput = document.getElementById('prefix').value.trim();
        return prefixInput ? prefixInput.toUpperCase() : 'RUB';
    }

    function generateRUBUID() {
        const rubuid = `${getPrefix()}-${crypto.randomUUID()}`;
        showOutput(rubuid);
    }

    function generateRUBUIDv2() {
        const timestamp = Date.now().toString(36); // base36 timestamp
        const randomPart = crypto.randomUUID().split('-').join('').slice(0,12);
        const rubuidv2 = `${getPrefix()}v2-${timestamp}-${randomPart}`;
        showOutput(rubuidv2);
    }

    function showOutput(uuid) {
        const output = document.getElementById('uuidOutput');
        output.value = uuid;
        addToHistory(uuid);
    }

    function addToHistory(uuid) {
        historyList.unshift(uuid);
        const historyDiv = document.getElementById('history');
        historyDiv.innerHTML = historyList.map(id => `<div>${id}</div>`).join('');
    }

    function copyToClipboard() {
        const output = document.getElementById('uuidOutput');
        if (output.value) {
            navigator.clipboard.writeText(output.value).then(() => {
                alert('Copied to clipboard!');
            });
        } else {
            alert('Nothing to copy!');
        }
    }

    function toggleTheme() {
        const body = document.body;
        body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    }
</script>

</body>
</html>
